<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>이력서-원유찬 | Junior Game Programmer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <main class="container">
    <section class="intro">
      <h1 id="intro-title"></h1>
      <p id="intro-subtitle"></p>
    </section>

    <section id="about">
      <h2 id="about-title"></h2>
      <div id="about-description"></div>
    </section>

    <section id="skills">
      <h2 id="skills-title"></h2>
      <ul id="skills-list"></ul>
    </section>

    <section id="projects">
      <h2 id="projects-title"></h2>
      <div id="projects-container"></div>
      <div id="technical-deep-dive-container"></div>
    </section>

    <section id="contact">
      <h2 id="contact-title"></h2>
      <p><strong>Email:</strong> <a id="contact-email" href=""></a></p>
      <p><strong>Phone:</strong> <span id="contact-phone"></span></p>
      <p><strong>GitHub:</strong> <a id="contact-github" href="" target="_blank"></a></p>
    </section>

    </section>
  </main>

  <script>
    async function loadContent() {
      try {
        const response = await fetch(`data/site_content.json?t=${new Date().getTime()}`);
        const data = await response.json();

        // Intro
        document.getElementById('intro-title').textContent = data.intro_title;
        document.getElementById('intro-subtitle').textContent = data.intro_subtitle;

        // About
        document.getElementById('about-title').textContent = data.about_title;
        const aboutDesc = document.getElementById('about-description');
        aboutDesc.innerHTML = data.about_description.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');

        // Skills
        document.getElementById('skills-title').textContent = data.skills_title;
        const skillsList = document.getElementById('skills-list');
        skillsList.innerHTML = data.skills_list.map(s => `<li>${s}</li>`).join('');

        // Projects
        const projectsContainer = document.getElementById('projects-container');
        projectsContainer.innerHTML = data.projects.map(project => `
          <table class="project-table">
            <tr>
              <th>프로젝트명</th>
              <td colspan="3"><strong>${project.name}</strong></td>
            </tr>
            <tr>
              <th>이미지(GIF)</th>
              <td colspan="3">
                <img src="${project.image}" alt="${project.name} Gameplay GIF"
                  style="max-width: 100%; border-radius: 8px;">
              </td>
            </tr>
            <tr>
              <th>프로젝트 개요</th>
              <td colspan="3">${project.summary.replace(/\n/g, '<br>')}</td>
            </tr>
            <tr>
              <th>작업 인원</th>
              <td>${project.team}</td>
              <th>기간</th>
              <td>${project.period}</td>
            </tr>
            <tr>
              <th>주요 기능</th>
              <td colspan="3">${project.features.replace(/\n/g, '<br>')}</td>
            </tr>
            <tr>
              <th>YouTube</th>
              <td colspan="3">
                <a href="${project.video_link}" target="_blank">프로젝트 영상 보기</a>
              </td>
            </tr>
          </table>
        `).join('');

        // Technical Deep Dive
        const deepDiveContainer = document.getElementById('technical-deep-dive-container');
        deepDiveContainer.innerHTML = `
          <table class="project-table">
            <tr>
              <th colspan="4" style="background: #f1f5f9; text-align: center; border-top: 2px solid var(--primary-color);">
                ${data.tech_dive_title}
              </th>
            </tr>
            <tr>
              <th>구현 목표</th>
              <td colspan="3">${data.tech_dive_goal}</td>
            </tr>
            <tr>
              <th>서버 아키텍처도</th>
              <td colspan="3">
                <img src="${data.tech_dive_arch_img}" alt="Server Architecture Blueprint"
                  style="max-width: 100%; border-radius: 8px; border: 1px solid var(--border-color);">
              </td>
            </tr>
            <tr>
              <th>서버 역할 분리<br>(Role-based)</th>
              <td colspan="3">${data.tech_dive_roles.replace(/\n/g, '<br>')}</td>
            </tr>
            <tr>
              <th>서버 간 통신</th>
              <td colspan="3">${data.tech_dive_comm.replace(/\n/g, '<br>')}</td>
            </tr>
            <tr>
              <th>비동기 처리 & DB</th>
              <td colspan="3">${data.tech_dive_async_db.replace(/\n/g, '<br>')}</td>
            </tr>
          </table>
        `;

        // Contact
        document.getElementById('contact-title').textContent = data.contact_title || 'Contact';
        const emailEl = document.getElementById('contact-email');
        emailEl.href = `mailto:${data.contact_email}`;
        emailEl.textContent = data.contact_email;
        document.getElementById('contact-phone').textContent = data.contact_phone;
        const githubEl = document.getElementById('contact-github');
        githubEl.href = data.contact_github;
        githubEl.textContent = data.contact_github.replace('https://', '');

      } catch (error) {
        console.error('Error loading content:', error);
      }
    }

    // Load content on startup
    loadContent();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>

</html>
