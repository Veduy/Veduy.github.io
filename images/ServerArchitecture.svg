<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Inter, Pretendard, sans-serif">
  <defs>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== Nodes ===== -->
  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="160" height="120" rx="16" fill="white" stroke="#dbeafe" stroke-width="1.5"/>
    <rect x="30" y="80" width="160" height="40" rx="16" fill="url(#clientGrad)"/>
    <rect x="30" y="104" width="160" height="16" fill="url(#clientGrad)"/>
    <text x="110" y="106" text-anchor="middle" fill="white" font-size="14" font-weight="700">Unreal Client</text>
    <text x="110" y="145" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Player Input</text>
    <text x="110" y="165" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Rendering</text>
    <text x="110" y="185" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Client Prediction</text>
  </g>

  <!-- Game Server -->
  <g filter="url(#shadow)">
    <rect x="280" y="80" width="160" height="120" rx="16" fill="white" stroke="#ede9fe" stroke-width="1.5"/>
    <rect x="280" y="80" width="160" height="40" rx="16" fill="url(#gameGrad)"/>
    <rect x="280" y="104" width="160" height="16" fill="url(#gameGrad)"/>
    <text x="360" y="106" text-anchor="middle" fill="white" font-size="14" font-weight="700">Game Server</text>
    <text x="360" y="145" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">RPC / Replication</text>
    <text x="360" y="165" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Game Logic</text>
    <text x="360" y="185" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Authority</text>
  </g>

  <!-- Web Server -->
  <g filter="url(#shadow)">
    <rect x="530" y="80" width="160" height="120" rx="16" fill="white" stroke="#d1fae5" stroke-width="1.5"/>
    <rect x="530" y="80" width="160" height="40" rx="16" fill="url(#webGrad)"/>
    <rect x="530" y="104" width="160" height="16" fill="url(#webGrad)"/>
    <text x="610" y="106" text-anchor="middle" fill="white" font-size="14" font-weight="700">Web Server</text>
    <text x="610" y="145" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">REST API</text>
    <text x="610" y="165" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Authentication</text>
    <text x="610" y="185" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Data Routing</text>
  </g>

  <!-- Database -->
  <g filter="url(#shadow)">
    <rect x="780" y="80" width="90" height="120" rx="16" fill="white" stroke="#fef3c7" stroke-width="1.5"/>
    <rect x="780" y="80" width="90" height="40" rx="16" fill="url(#dbGrad)"/>
    <rect x="780" y="104" width="90" height="16" fill="url(#dbGrad)"/>
    <text x="825" y="106" text-anchor="middle" fill="white" font-size="14" font-weight="700">DB</text>
    <text x="825" y="148" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Player</text>
    <text x="825" y="168" text-anchor="middle" fill="#475569" font-size="11" font-weight="500">Data</text>
  </g>

  <!-- ===== Arrows ===== -->
  <!-- Client <-> Game Server (UDP) -->
  <line x1="190" y1="128" x2="280" y2="128" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 3"/>
  <polygon points="276,123 284,128 276,133" fill="#7c3aed"/>
  <line x1="280" y1="152" x2="190" y2="152" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 3"/>
  <polygon points="194,147 186,152 194,157" fill="#3b82f6"/>

  <!-- Protocol label: UDP -->
  <rect x="207" y="104" width="56" height="22" rx="11" fill="#7c3aed"/>
  <text x="235" y="118" text-anchor="middle" fill="white" font-size="11" font-weight="700">UDP</text>

  <!-- Game Server <-> Web Server (HTTP) -->
  <line x1="440" y1="128" x2="530" y2="128" stroke="#059669" stroke-width="2.5"/>
  <polygon points="526,123 534,128 526,133" fill="#059669"/>
  <line x1="530" y1="152" x2="440" y2="152" stroke="#8b5cf6" stroke-width="2.5"/>
  <polygon points="444,147 436,152 444,157" fill="#8b5cf6"/>

  <!-- Protocol label: HTTP -->
  <rect x="455" y="104" width="60" height="22" rx="11" fill="#059669"/>
  <text x="485" y="118" text-anchor="middle" fill="white" font-size="11" font-weight="700">HTTP</text>

  <!-- Web Server <-> DB -->
  <line x1="690" y1="140" x2="780" y2="140" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="776,135 784,140 776,145" fill="#d97706"/>
  <line x1="780" y1="160" x2="690" y2="160" stroke="#d97706" stroke-width="2.5"/>
  <polygon points="694,155 686,160 694,165" fill="#d97706"/>

  <!-- Protocol label: SQL -->
  <rect x="707" y="126" width="48" height="22" rx="11" fill="#d97706"/>
  <text x="731" y="140" text-anchor="middle" fill="white" font-size="11" font-weight="700">SQL</text>

  <!-- ===== Legend ===== -->
  <line x1="50" y1="245" x2="80" y2="245" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="88" y="249" fill="#475569" font-size="11" font-weight="500">Realtime (UDP)</text>

  <line x1="220" y1="245" x2="250" y2="245" stroke="#059669" stroke-width="2"/>
  <text x="258" y="249" fill="#475569" font-size="11" font-weight="500">RESTful (HTTP)</text>

  <line x1="400" y1="245" x2="430" y2="245" stroke="#d97706" stroke-width="2"/>
  <text x="438" y="249" fill="#475569" font-size="11" font-weight="500">Database Query</text>

  <!-- Direction note -->
  <text x="650" y="249" fill="#94a3b8" font-size="10" font-weight="400">Bidirectional Communication</text>
</svg>
