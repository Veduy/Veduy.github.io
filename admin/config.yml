backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Site Content"
    delete: false
    editor:
      preview: false
    files:
      - name: "site_data"
        label: "Website Content"
        file: "data/site_content.json"
        extension: "json"
        format: "json"
        fields:
          - { label: "Intro Title", name: "intro_title", widget: "string" }
          - { label: "Intro Subtitle", name: "intro_subtitle", widget: "string" }
          - { label: "About Title", name: "about_title", widget: "string" }
          - { label: "About Description", name: "about_description", widget: "text" }
          - { label: "Skills Title", name: "skills_title", widget: "string" }
          - { label: "Skill List", name: "skills_list", widget: "list", field: { label: "Skill", name: "skill", widget: "string" } }
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Image Path", name: "image", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Team", name: "team", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Features", name: "features", widget: "text" }
              - { label: "Video Link", name: "video_link", widget: "string" }
          - { label: "Deep Dive Title", name: "tech_dive_title", widget: "string" }
          - { label: "Goal", name: "tech_dive_goal", widget: "text" }
          - { label: "Arch Image", name: "tech_dive_arch_img", widget: "string" }
          - { label: "Roles", name: "tech_dive_roles", widget: "text" }
          - { label: "Communication", name: "tech_dive_comm", widget: "text" }
          - { label: "Async & DB", name: "tech_dive_async_db", widget: "text" }
          - { label: "Contact Email", name: "contact_email", widget: "string" }
          - { label: "Contact Phone", name: "contact_phone", widget: "string" }
          - { label: "Contact GitHub", name: "contact_github", widget: "string" }
